params:
  - id: admin_username
    type: string
    name: 管理员用户名
    description: 登录签到面板使用的用户名
    default_value: admin
    optional: true

  - id: admin_password
    type: secret
    name: 管理员密码
    description: 登录签到面板使用的密码，至少 12 位，不能以 CHANGE_ME 开头，否则服务无法启动

locales:
  en:
    admin_username:
      name: Admin username
      description: Username for the dashboard
    admin_password:
      name: Admin password
      description: Dashboard password, at least 12 characters
